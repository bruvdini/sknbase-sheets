<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Product Sheet</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #F7F3EE;
    --accent: #D99C82;
    --accent-dark: #C47B5A;
    --ring: #D9B8A5;
    --text: #2B2B2B;
    --text-mid: #7A6A60;
    --text-light: #B8A89E;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    font-family: 'Poppins', -apple-system, sans-serif;
    overflow-x: hidden;
  }

  .sheet {
    width: 100%;
    min-height: 100vh;
    background: var(--bg);
    padding: 0 0 40px;
    display: flex;
    flex-direction: column;
    animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .handle {
    width: 40px; height: 4px;
    background: var(--ring);
    border-radius: 2px;
    margin: 12px auto 0;
  }

  .image-wrap {
    position: relative;
    width: 100%;
    height: 260px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 12px;
    overflow: hidden;
  }

  .product-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 20px;
  }

  .score-badge {
    position: absolute;
    top: 14px; left: 14px;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    color: white;
    letter-spacing: 0.02em;
  }

  .score-badge.high { background: #4CAF50; }
  .score-badge.mid  { background: #FF9800; }
  .score-badge.low  { background: #F44336; }

  .category-tag {
    position: absolute;
    top: 14px; right: 14px;
    padding: 5px 12px;
    border-radius: 20px;
    background: rgba(217,156,130,0.15);
    font-size: 11px;
    font-weight: 500;
    color: var(--accent-dark);
    border: 1px solid rgba(217,156,130,0.3);
  }

  .product-info { padding: 20px 20px 0; }

  .brand-name {
    font-size: 12px; font-weight: 500;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 4px;
  }

  .product-name {
    font-size: 20px; font-weight: 700;
    color: var(--text);
    line-height: 1.2;
    margin-bottom: 8px;
  }

  .product-price {
    font-size: 18px; font-weight: 600;
    color: var(--accent-dark);
  }

  .why-section {
    margin: 16px 20px 0;
    background: white;
    border-radius: 14px;
    padding: 14px 16px;
  }

  .why-label {
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .why-text {
    font-size: 13px;
    color: var(--text-mid);
    line-height: 1.55;
  }

  .divider {
    height: 1px;
    background: var(--ring);
    opacity: 0.4;
    margin: 20px 20px 0;
  }

  .buy-section { padding: 16px 20px 0; }

  .buy-label {
    font-size: 12px; font-weight: 600;
    color: var(--text-mid);
    margin-bottom: 12px;
    letter-spacing: 0.05em;
  }

  .store-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 14px 16px;
    background: white;
    border: 1.5px solid transparent;
    border-radius: 14px;
    margin-bottom: 10px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s ease;
    box-shadow: 0 1px 6px rgba(0,0,0,0.06);
  }

  .store-btn:active {
    transform: scale(0.98);
    border-color: var(--accent);
    box-shadow: 0 2px 12px rgba(217,156,130,0.2);
  }

  .store-btn.unavailable {
    opacity: 0.45;
    pointer-events: none;
  }

  .store-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .store-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  .store-dot.unavailable { background: var(--text-light); }

  .store-name {
    font-size: 14px; font-weight: 500;
    color: var(--text);
  }

  .store-status {
    font-size: 11px;
    color: var(--text-light);
    margin-top: 1px;
  }

  .shop-btn {
    background: var(--accent);
    color: white;
    font-size: 12px; font-weight: 600;
    padding: 6px 14px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
  }

  .store-btn.unavailable .shop-btn { background: var(--ring); }

  .error-msg {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-light);
    font-size: 13px;
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="sheet" id="sheet" style="display:none">
  <div class="handle"></div>
  <div class="image-wrap">
    <img class="product-img" id="productImg" src="" alt="Product" onerror="this.style.display='none'" />
    <div class="score-badge" id="scoreBadge"></div>
    <div class="category-tag" id="categoryTag"></div>
  </div>
  <div class="product-info">
    <div class="brand-name" id="brandName"></div>
    <div class="product-name" id="productName"></div>
    <div class="product-price" id="productPrice"></div>
  </div>
  <div class="why-section" id="whySection">
    <div class="why-label">✨ Why this works for you</div>
    <div class="why-text" id="whyText"></div>
  </div>
  <div class="divider"></div>
  <div class="buy-section">
    <div class="buy-label">BUY ONLINE</div>
    <div id="storeList"></div>
  </div>
</div>

<div id="errorMsg" class="error-msg" style="display:none">Product not found.</div>

  function formatPrice(p) {
    return '₦' + p.toLocaleString('en-NG');
  }

  function getScoreClass(score) {
    if (score >= 8.5) return 'high';
    if (score >= 7.0) return 'mid';
    return 'low';
  }

  function render(slug, why, score, image) {
    var product = products[slug];
    if (!product) {
      document.getElementById('errorMsg').style.display = 'block';
      return;
    }

    // Use passed image URL if available, else fall back to nothing
    document.getElementById('productImg').src = image || '';

    // Score badge
    var badge = document.getElementById('scoreBadge');
    if (score > 0) {
      badge.textContent = score + '/10';
      badge.className = 'score-badge ' + getScoreClass(score);
    } else {
      badge.style.display = 'none';
    }

    document.getElementById('categoryTag').textContent = product.category;
    document.getElementById('brandName').textContent = product.brand;
    document.getElementById('productName').textContent = product.name;
    document.getElementById('productPrice').textContent = formatPrice(product.price);

    if (why) {
      document.getElementById('whyText').textContent = why;
    } else {
      document.getElementById('whySection').style.display = 'none';
    }

    // Store buttons
    var storeList = document.getElementById('storeList');
    storeList.innerHTML = '';
    product.stores.forEach(function(store) {
      var a = document.createElement('a');
      a.className = 'store-btn' + (store.unavailable ? ' unavailable' : '');
      a.href = store.unavailable ? '#' : store.url;
      if (!store.unavailable) a.target = '_blank';
      a.innerHTML =
        '<div class="store-left">' +
          '<div class="store-dot' + (store.unavailable ? ' unavailable' : '') + '"></div>' +
          '<div>' +
            '<div class="store-name">' + store.name + '</div>' +
            '<div class="store-status">' + (store.unavailable ? 'Out of stock' : 'In stock') + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="store-right">' +
          '<div class="shop-btn">' + (store.unavailable ? 'Unavailable' : 'Shop →') + '</div>' +
        '</div>';
      storeList.appendChild(a);
    });

    document.getElementById('sheet').style.display = 'flex';
  }

  window.addEventListener('DOMContentLoaded', function() {
    var params = new URLSearchParams(window.location.search);
    var slug  = params.get('product') || '';
    var why   = params.get('why') || '';
    var score = parseFloat(params.get('score')) || 0;
    var image = params.get('image') || '';

    if (slug) {
      render(slug, why, score, image);
    } else {
      document.getElementById('errorMsg').style.display = 'block';
    }
  });
</script>
</body>
</html>
